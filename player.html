<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reel Player</title>

  <!-- Warm the connection to R2 (media host) as early as possible, so the DNS
       lookup + TLS handshake for the first video/audio request is already done
       by the time js/config.js's R2_PUBLIC_URL is actually used - keep this in
       sync with that value if it ever changes. -->
  <link rel="preconnect" href="https://media.boxedape.com" crossorigin>

  <!-- ============================================
       CSS IMPORTS - Single Source of Truth
       All styles imported from actual CSS files
       ============================================ -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/player.css">
  <link rel="stylesheet" href="css/playlist.css">
  <link rel="stylesheet" href="css/expandable.css">
  
  <style>
    /* ============================================
       IFRAME-SPECIFIC STYLES
       Minimal overrides for embed context
       ============================================ */
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      height: 100%;
    }
    
    #embedPlayer {
      width: 100%;
      min-height: 300px;
      height: 100%;
      position: relative;
      box-sizing: border-box;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    .error-message {
      color: #dc3545;
      text-align: center;
      padding: 2rem;
      background: #f8f9fa;
      border-radius: 8px;
      margin: 1rem;
    }
    
    .loading-message {
      color: #6c757d;
      text-align: center;
      padding: 2rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div id="embedPlayer">
    <div class="loading-message">Loading player...</div>
  </div>

  <!-- WaveSurfer.js - Audio waveform library -->
  <script src="https://cdn.jsdelivr.net/npm/wavesurfer.js@7"></script>
  
  <script type="module">
    /* ============================================
       REEL PLAYER EMBED
       Loads and initializes player from stored reel data
       References player.js module for all functionality
       ============================================ */
    
    // Import actual player module and utilities
    import { playerApp } from './js/player.js';
    import { getColorFilters } from './js/modules/colorUtils.js';
    import { WORKER_BASE_URL } from './js/config.js';
    import { createPlayerClosedIdleManager } from './js/modules/playerClosedIdle.js';

    // Exposed so sibling reelplayer <iframe>s on the same host page (any
    // number of separate embeds, each same-origin to this one regardless of
    // what origin the host page itself is) can reach in directly via
    // window.top.frames and call pauseForOtherPlayer() - see
    // playerApp.pauseOtherPlayers() in js/player.js for the calling side.
    window.playerApp = playerApp;

    // ============================================
    // INITIALIZATION
    // ============================================
    
    // Get reel ID from URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const reelId = urlParams.get('id');
    
    if (!reelId) {
      showError('No reel ID provided');
    } else {
      loadAndRenderReel(reelId);
    }
    
    /* ============================================
       MAIN LOADING FUNCTION
       ============================================ */
    async function loadAndRenderReel(reelId) {
      try {
        // Fetch reel data from the Worker (see loadReelData below)
        const reelData = await loadReelData(reelId);
        
        if (!reelData) {
          showError('Reel not found');
          return;
        }
        
        // Validate reel has tracks
        if (!reelData.playlist || reelData.playlist.length === 0) {
          showError('No tracks found in reel');
          return;
        }
        
        // Apply custom CSS variables from reel settings
        applyReelStyles(reelData);
        
        // Render player HTML using same structure as main player
        renderPlayerHTML(reelData);
        
        // Initialize player using actual playerApp module
        initializeEmbedPlayer(reelData);
        
      } catch (error) {
        console.error('Failed to load reel:', error);
        showError('Failed to load reel');
      }
    }
    
    /* ============================================
       REEL DATA LOADING
       Fetches from the Cloudflare Worker so any visitor's browser can
       resolve the reel, regardless of where it was originally published from.
       ============================================ */
    async function loadReelData(reelId) {
      try {
        const response = await fetch(`${WORKER_BASE_URL}/reels/${reelId}`);
        if (!response.ok) return null;
        return await response.json();
      } catch (e) {
        console.error('Failed to fetch reel from Worker:', e);
        return null;
      }
    }
    
    /* ============================================
       ERROR DISPLAY
       ============================================ */
    function showError(message) {
      document.getElementById('embedPlayer').innerHTML = 
        `<div class="error-message">❌ ${message}</div>`;
    }
    
    /* ============================================
       APPLY REEL STYLES
       Sets CSS variables and container styles
       Matches PreviewManager behavior exactly
       ============================================ */
    function applyReelStyles(reelData) {
      const settings = reelData.settings || {};
      const ta = settings.titleAppearance || {};
      
      // Process padding
      let paddingBottom = ta.paddingBottom || "1.5rem";
      if (typeof paddingBottom === "string" && !paddingBottom.match(/[a-z%]+$/)) {
        paddingBottom = paddingBottom + "px";
      }
      
      // Process background configuration
      // NEW IMPLEMENTATION (matches PreviewManager exactly):
      // - backgroundColor is ALWAYS the base solid color behind everything
      // - overlayColor is ALWAYS applied to ::before pseudo-element (with blur)
      // - backgroundImage is only included if enabled
      
      const backgroundImage = (settings.backgroundImageEnabled && settings.backgroundImage && settings.backgroundImage.trim()) 
        ? settings.backgroundImage 
        : null;
      
      // backgroundColor is ALWAYS the base solid color
      const backgroundColor = reelData.backgroundColor || settings.backgroundColor || "rgba(255, 255, 255, 1)";
      
      // overlayColor is ALWAYS applied to ::before (transparent by default)
      let overlayColor = "rgba(255, 255, 255, 0)";
      if (settings.overlayColorEnabled && settings.overlayColor) {
        overlayColor = settings.overlayColor;
      }

      // Split into the RGB/alpha custom properties the ::before rule actually
      // reads (css/player.css: background-color: rgba(var(--overlay-base-color), var(--overlay-opacity)))
      // - matches PreviewManager.generateStyleConfig() exactly.
      const overlayRGBAMatch = overlayColor.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
      const overlayBaseColor = overlayRGBAMatch
        ? `${overlayRGBAMatch[1]}, ${overlayRGBAMatch[2]}, ${overlayRGBAMatch[3]}`
        : "255, 255, 255";
      const overlayOpacity = overlayRGBAMatch && overlayRGBAMatch[4] !== undefined
        ? parseFloat(overlayRGBAMatch[4])
        : 0;

      // Same split for the player-closed-idle overlay tint
      const closedIdleOverlayColor = settings.playerClosedIdleOverlayColor || 'rgba(0, 0, 0, 0.7)';
      const closedIdleOverlayRGBAMatch = closedIdleOverlayColor.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
      const closedIdleOverlayBaseColor = closedIdleOverlayRGBAMatch
        ? `${closedIdleOverlayRGBAMatch[1]}, ${closedIdleOverlayRGBAMatch[2]}, ${closedIdleOverlayRGBAMatch[3]}`
        : "0, 0, 0";
      const closedIdleOverlayOpacity = closedIdleOverlayRGBAMatch && closedIdleOverlayRGBAMatch[4] !== undefined
        ? parseFloat(closedIdleOverlayRGBAMatch[4])
        : 0.7;

      const uiAccentColor = settings.varUiAccent || '#2a0026';
      
      // Calculate Lottie color filters for loading animation
      const colorFilters = getColorFilters(uiAccentColor);
      
      // ============================================
      // Apply CSS variables to document root
      // ============================================
      const root = document.documentElement;
      
      // Color variables
      root.style.setProperty('--ui-accent', uiAccentColor);
      root.style.setProperty('--waveform-unplayed', settings.varWaveformUnplayed || '#929292');
      root.style.setProperty('--waveform-hover', settings.varWaveformHover || 'rgba(0, 31, 103, 0.13)');

      // Title appearance variables
      root.style.setProperty('--reel-title-size', ta.fontSize || '1.3rem');
      root.style.setProperty('--reel-title-weight', ta.fontWeight || '700');
      root.style.setProperty('--reel-title-align', ta.align || 'center');
      root.style.setProperty('--reel-title-padding-bottom', paddingBottom);
      
      // Background variables
      root.style.setProperty('--background-image', backgroundImage ? `url("${backgroundImage}")` : 'none');
      root.style.setProperty('--background-color', backgroundColor);
      root.style.setProperty('--background-opacity', settings.backgroundOpacity || '1');
      root.style.setProperty('--background-blur', (settings.backgroundBlur || '2') + 'px');
      root.style.setProperty('--background-zoom', settings.backgroundZoom || '1');
      root.style.setProperty('--overlay-color', overlayColor);
      root.style.setProperty('--overlay-base-color', overlayBaseColor);
      root.style.setProperty('--overlay-opacity', overlayOpacity);

      // Lottie animation color variables
      root.style.setProperty('--lottie-brightness', colorFilters.brightness);
      root.style.setProperty('--lottie-saturation', colorFilters.saturation);
      root.style.setProperty('--lottie-hue-rotation', `${colorFilters.hueRotation}deg`);
      
      // Player height settings
      const playerHeight = reelData.playerHeight || 500;
      root.style.setProperty('--player-height', `${playerHeight}px`);
      
      // Expandable mode height settings
      root.style.setProperty('--expandable-collapsed-height', `${settings.expandableCollapsedHeight || 120}px`);
      root.style.setProperty('--expandable-expanded-height', `${settings.expandableExpandedHeight || 500}px`);

      // Player closed idle variables
      root.style.setProperty('--player-closed-idle-overlay-base-color', closedIdleOverlayBaseColor);
      root.style.setProperty('--player-closed-idle-overlay-opacity', closedIdleOverlayOpacity);
      root.style.setProperty('--player-closed-idle-blur', `${settings.playerClosedIdleBlur ?? 8}px`);

      // Hover darken - see js/modules/previewManager.js for the same computation
      root.style.setProperty('--hover-darken-target-brightness', 1 - (settings.hoverDarkenAmount ?? 15) / 100);
      root.style.setProperty('--idle-unblur-target-reduction', (settings.idleUnblurAmount ?? 50) / 100);

      // ============================================
      // Apply container styles
      // ============================================
      const container = document.getElementById('embedPlayer');
      const mode = reelData.mode || 'static';
      
      // Set minimum height based on mode
      const initialHeight = mode === 'expandable'
        ? (settings.expandableCollapsedHeight || 120)
        : playerHeight;
      container.style.minHeight = `${initialHeight}px`;

      // Notify parent window if in iframe (for iframe height adjustment).
      // expandable.js's own expandPlayer()/collapsePlayer() send this same
      // message, but only on the first expand/collapse interaction - a host
      // page that sizes its iframe off this message (rather than a hardcoded
      // fixed height, e.g. a page built around a different reel's mode) never
      // gets told the correct height at all for static mode, or before the
      // first interaction in expandable mode. Flagged `initial: true` so a
      // listener can size the iframe instantly instead of animating into it -
      // an animated *first* resize looks exactly like an expand animation
      // playing on load, which is wrong for static mode and just an odd
      // flourish for expandable mode's own idle-collapsed starting height.
      if (window.self !== window.top) {
        window.parent.postMessage({ type: 'reelplayer:resize', height: initialHeight, initial: true }, '*');
      }

      // Apply base background color (always applied)
      container.style.backgroundColor = backgroundColor;
      
      // Apply background image if present
      if (backgroundImage) {
        container.style.backgroundImage = `url("${backgroundImage}")`;
        container.style.backgroundSize = 'cover';
        container.style.backgroundPosition = 'center';
      } else {
        // Clear any previously set background image
        container.style.backgroundImage = 'none';
      }

      // NOTE: Overlay color and blur are now handled by CSS variables
      // applied to .player-wrapper::before pseudo-element
      // This ensures consistent behavior with the preview
      // No need to create a separate overlay div
    }
    
    /* ============================================
       RENDER PLAYER HTML
       Builds complete player structure
       Matches playerApp.renderPlayer() structure exactly
       ============================================ */
    function renderPlayerHTML(reelData) {
      const container = document.getElementById('embedPlayer');
      const shouldHideTitle = !(reelData.showTitle && reelData.title && reelData.title.trim());
      const settings = reelData.settings || {};
      const mode = reelData.mode || 'static';

      // Determine player wrapper classes
      let wrapperClasses = 'player-wrapper';
      if (shouldHideTitle) wrapperClasses += ' no-title';
      if (mode === 'expandable') wrapperClasses += ' expandable-mode';
      if (settings.hoverDarkenEnabled) wrapperClasses += ' hover-darken-enabled';
      if (settings.idleUnblurEnabled) wrapperClasses += ' idle-unblur-enabled';

      // Build project title overlay HTML for expandable mode
      let projectTitleOverlayHTML = '';
      if (mode === 'expandable' && settings.projectTitleImage) {
        // needs-intro always applies here - an embed only ever renders once,
        // so this is always playerApp's first load (see renderPlayer()'s
        // isFirstLoad/lastProjectTitleImageUrl check in js/player.js).
        projectTitleOverlayHTML = `
          <div class="project-title-overlay needs-intro" style="background-image: url('${settings.projectTitleImage}');" data-image-url="${settings.projectTitleImage}"></div>
        `;
      }
      
      // Build complete player HTML structure
      // IMPORTANT: Must match playerApp.renderPlayer() structure exactly
      const playerHTML = `
        <div class="${wrapperClasses}" style="position: relative; z-index: 2;">
          <!-- Background layers for track-specific images -->
          <div class="track-background-layer track-bg-layer-a"></div>
          <div class="track-background-layer track-bg-layer-b"></div>
          
          <!-- Video background layers (dual-buffer for crossfade). Class lists must
               match js/player.js's renderPlayer() exactly, including the unsuffixed
               "main-video"/"track-video" base class - videoPlayback.js's fadeOutVideo()
               reads that exact class (not the -a/-b suffixed one) to determine which
               type to pass to cleanupVideo(). Missing it here silently misrouted every
               track video cleanup as type 'main', which compares against the wrong
               layer pointer and left trackVideoPlaying stuck true forever - closed-idle
               entering once successfully and then never being able to re-enter, since
               checkConditions() perpetually believed a video was still active. -->
          <video class="background-video main-video main-video-a" preload="auto" muted loop playsinline></video>
          <video class="background-video main-video main-video-b" preload="auto" muted loop playsinline></video>
          <video class="background-video track-video track-video-a" preload="auto" muted loop playsinline></video>
          <video class="background-video track-video track-video-b" preload="auto" muted loop playsinline></video>
          <div class="player-closed-idle-overlay"></div>

          ${projectTitleOverlayHTML}
          <div class="player-content">
            ${reelData.showTitle && reelData.title && reelData.title.trim() ? 
              `<div class="reel-title">${reelData.title}</div>` : ''}
            <div class="track-info"></div>
            <div class="player-container">
              <button id="playPause" class="icon-button">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="heroicon">
                  <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm14.024-.983a1.125 1.125 0 0 1 0 1.966l-5.603 3.113A1.125 1.125 0 0 1 9 15.113V8.887c0-.857.921-1.4 1.671-.983l5.603 3.113Z" clip-rule="evenodd"/>
                </svg>
              </button>
              <div class="waveform-and-volume">
                <div id="waveform">
                  <div class="hover-overlay"></div>
                  <div class="hover-time">0:00</div>
                  <div class="playhead-time">0:00</div>
                  <div id="total-time" class="total-time">0:00</div>
                  <div id="loading" class="loading">
                    <div class="spinner"></div>
                  </div>
                </div>
                <div class="volume-control hidden">
                  <button id="volumeToggle" class="icon-button">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="heroicon">
                      <path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 0 0 1.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06ZM18.584 5.106a.75.75 0 0 1 1.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 0 1-1.06-1.06 8.25 8.25 0 0 0 0-11.668.75.75 0 0 1 0-1.06Z"/>
                      <path d="M15.932 7.757a.75.75 0 0 1 1.061 0 6 6 0 0 1 0 8.486.75.75 0 0 1-1.06-1.061 4.5 4.5 0 0 0 0-6.364.75.75 0 0 1 0-1.06Z"/>
                    </svg>
                  </button>
                  <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1"/>
                </div>
              </div>
            </div>
          </div>
          <div id="playlist" class="playlist${shouldHideTitle ? ' no-title' : ''}"></div>
          ${mode === 'expandable' ? '<div class="expandable-tap-bar"></div>' : ''}
        </div>
      `;
      
      // Clear loading message and insert player HTML
      container.innerHTML = '';
      container.insertAdjacentHTML('beforeend', playerHTML);
    }
    
    /* ============================================
       INITIALIZE EMBED PLAYER
       Sets up playerApp with reel configuration
       Calls all necessary setup methods
       ============================================ */
    function initializeEmbedPlayer(reelData) {
      console.log('🎵 Initializing embed player with reel:', reelData.id || 'unknown');
      
      // currentReelSettings must be a *flat* object - the builder's own preview
      // (js/player.js renderPlayer()) hands playerApp the flat live-edit reel,
      // and several modules (playerClosedIdle.js, videoLayerState.js,
      // videoPlayback.js) read settings like enablePlayerClosedIdle,
      // backgroundVideoEnabled, backgroundVideo straight off currentReelSettings
      // rather than currentReelSettings.settings. Flatten here so a real
      // published embed (whose data is nested under reelData.settings) behaves
      // the same as the builder preview instead of silently no-op'ing those
      // settings.
      playerApp.reel = reelData.settings || {};
      playerApp.currentReelSettings = { ...reelData, ...(reelData.settings || {}) };
      
      // Configure expandable mode state (matches main player's renderPlayer method)
      const mode = reelData.mode || 'static';
      playerApp.expandable.enabled = (mode === 'expandable');
      playerApp.expandable.isExpanded = false;
      playerApp.expandable.isPlaying = false;
      // Same flat shape as currentReelSettings above - js/player.js reads
      // this.expandable.settings?.showWaveformOnCollapse unnested.
      playerApp.expandable.settings = { ...reelData, ...(reelData.settings || {}) };
      playerApp.expandable.showWaveformOnCollapse = reelData.settings?.showWaveformOnCollapse !== false;
      
      console.log(`✓ Mode: ${mode}${mode === 'expandable' ? ' (expandable)' : ' (static)'}`);
      
      // ============================================
      // Cache DOM elements
      // ============================================
      playerApp.elements = {};
      playerApp.cacheElements();

      // ============================================
      // Player-closed-idle manager
      // js/player.js's own renderPlayer() (used by the builder preview)
      // creates this every render - initializeEmbedPlayer() is a separate,
      // hand-duplicated equivalent of that method and was missing this
      // entirely, which silently no-op'd every closedIdleManager?.* call
      // throughout player.js (checkConditions/preloadIdleVideo/exit) in the
      // embedded player specifically, since optional chaining swallows a
      // missing object with no error - closed-idle worked in the builder
      // preview and never in a real embed.
      // ============================================
      if (!playerApp.closedIdleManager) {
        playerApp.closedIdleManager = createPlayerClosedIdleManager(playerApp);
      }
      playerApp.closedIdleManager.initialize();

      // ============================================
      // Setup mode-specific interactions
      // Matches js/player.js's own renderPlayer() (used by the builder
      // preview) - that one calls setupStaticModeInteractions() in the else
      // branch here, which this hand-duplicated copy was missing entirely.
      // That silently dropped static mode's idle-timer/touchstart listeners
      // in every real embed - playback-idle exit-on-touch only ever worked
      // in the builder preview, never in a published static-mode embed.
      // ============================================
      if (playerApp.expandable.enabled) {
        playerApp.setupExpandableModeInteractions();
        playerApp.validateProjectTitleImage();
        console.log('✓ Expandable mode interactions enabled');
      } else {
        playerApp.setupStaticModeInteractions();
        console.log('✓ Static mode interactions enabled');
      }

      // hoverDarkenEnabled is independent of expandable/static mode, so this
      // is wired separately from the block above - see the method's own
      // comment in js/player.js for why touch needs a different trigger than
      // the desktop :hover CSS rule.
      playerApp.setupHoverDarkenTouchInteractions();
      playerApp.setupIdleUnblurTouchInteractions();
      playerApp.setupWaveformWidthTracking();

      // ============================================
      // Setup player components
      // All functionality imported from player.js module
      // ============================================
      playerApp.setupWaveSurfer();
      playerApp.setupWaveformEvents();
      playerApp.setupPlayPauseUI();
      playerApp.setupVolumeControls();
      console.log('✓ Player components initialized');
      
      // ============================================
      // Load playlist and first track
      // ============================================
      if (reelData.playlist && reelData.playlist.length) {
        playerApp.renderPlaylist(reelData.playlist);
        const firstTrack = reelData.playlist[0];
        const url = playerApp.convertDropboxLinkToDirect(firstTrack.url);
        playerApp.initializePlayer(url, firstTrack.title, 0);
        // Pre-buffer the inactive video layer so the first crossfade is
        // instant, matching renderPlayer()'s call in js/player.js.
        playerApp.preloadVideos();

        // Set initial track info display
        const trackInfo = playerApp.elements.trackInfo;
        if (trackInfo) {
          const fileName = firstTrack.title || 
            firstTrack.url.split('/').pop().split('?')[0]
              .replace(/[_-]/g, ' ').replace(/\.[^/.]+$/, '');
          trackInfo.textContent = fileName;
          trackInfo.classList.add('visible');
        }
        
        console.log(`✓ Loaded ${reelData.playlist.length} track(s)`);
      }
      
      // ============================================
      // Setup keyboard controls
      // ============================================
      setupKeyboardControls();
      
      // ============================================
      // Setup playback event listeners
      // ============================================
      setupPlaybackEventListeners();
      
      console.log('✅ Player initialization complete');
    }
    
    /* ============================================
       KEYBOARD CONTROLS
       Spacebar play/pause for embed
       ============================================ */
    function setupKeyboardControls() {
      document.addEventListener("keydown", (e) => {
        const active = document.activeElement;
        const isTyping = active && (
          active.tagName === "INPUT" ||
          active.tagName === "TEXTAREA" ||
          active.isContentEditable
        );
        
        if (!isTyping && (e.code === "Space" || e.key === " ")) {
          e.preventDefault();
          if (playerApp.wavesurfer && playerApp.isWaveformReady) {
            playerApp.wavesurfer.playPause();
          }
        }
      });
    }
    
    /* ============================================
       PLAYBACK EVENT LISTENERS
       Updates play/pause button icons
       ============================================ */
    function setupPlaybackEventListeners() {
      // Update to pause icon when playing
      document.addEventListener("playback:play", () => {
        const playPauseBtn = playerApp.elements.playPauseBtn;
        if (playPauseBtn) {
          playPauseBtn.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="heroicon">
              <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12ZM9 8.25a.75.75 0 0 0-.75.75v6c0 .414.336.75.75.75h.75a.75.75 0 0 0 .75-.75V9a.75.75 0 0 0-.75-.75H9Zm5.25 0a.75.75 0 0 0-.75.75v6c0 .414.336.75.75.75H15a.75.75 0 0 0 .75-.75V9a.75.75 0 0 0-.75-.75h-.75Z" clip-rule="evenodd" />
            </svg>
          `;
        }
      });
      
      // Update to play icon when paused
      document.addEventListener("playback:pause", () => {
        const playPauseBtn = playerApp.elements.playPauseBtn;
        if (playPauseBtn) {
          playPauseBtn.innerHTML = `
