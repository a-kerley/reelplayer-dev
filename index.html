<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Reel</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <!-- Pickr Color Picker -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/nano.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr"></script>
    <!-- Lottie Web -->
    <script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs" type="module"></script>
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/player.css" />
    <link rel="stylesheet" href="css/playlist.css" />
    <link rel="stylesheet" href="css/builder.css" />
    <link rel="stylesheet" href="css/page.css" />
    <link rel="stylesheet" href="css/expandable.css" />
    <link rel="stylesheet" href="css/file-picker.css" />
  </head>
  <body>
    <!-- === Builder UI (start) === -->
    <div class="builder-app">
      <aside class="builder-sidebar">
        <div class="sidebar-tabs">
          <button type="button" id="tabReelsBtn" class="sidebar-tab active">Reels</button>
          <button type="button" id="tabPagesBtn" class="sidebar-tab">Pages</button>
          <button type="button" id="tabMediaBtn" class="sidebar-tab">Media Library</button>
        </div>
        <div id="reelsPanel">
          <button id="newReelBtn">+ New Reel</button>
          <span id="draftSaveStatus" class="draft-save-status"></span>
          <ul id="reelList"></ul>
        </div>
        <div id="pagesPanel" style="display: none;">
          <button id="newPageBtn">+ New Page</button>
          <span id="pageDraftSaveStatus" class="draft-save-status"></span>
          <ul id="pageList"></ul>
        </div>
        <div id="mediaPanel" style="display: none;">
          <p class="builder-empty-state">Browse and manage all uploaded media.</p>
        </div>
      </aside>
      <main class="builder-main">
        <div id="builderLoadingOverlay" class="builder-loading-overlay" hidden>
          <div id="builderLoadingContent">Loading…</div>
        </div>
        <div id="reelBuilderView">
          <form id="reelForm" autocomplete="off">
            <label>
              Title:
              <input type="text" id="reelTitle" class="filename-display" />
            </label>
            <label style="margin-top: 1rem; display: block">
              <input type="checkbox" id="reelShowTitle" />
              Display Reel Title in Player
            </label>
            <!-- Tracks editor section now inserted dynamically by JS in builder.js -->
            <button type="button" id="exportEmbedBtn">Export Embed Code</button>
            <button type="button" id="manageEmbedsBtn">Manage Published Embeds</button>
          </form>
          <button type="button" id="refreshPreviewBtn">Refresh Preview</button>
          <div id="reelPlayerPreview"></div>
        </div>
        <div id="pageBuilderView" style="display: none;"></div>
        <div id="mediaLibraryView" style="display: none;"></div>
      </main>
    </div>
    <!-- === Builder UI (end) === -->

    <script src="https://unpkg.com/wavesurfer.js@7"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
