name = "reelplayer-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

kv_namespaces = [
  { binding = "REELS", id = "5114e49752a3447fb64d946f9ce7606b" }
]

r2_buckets = [
  { binding = "MEDIA", bucket_name = "reelplayer-media" }
]

# Cloudflare Access (see "Auth" in src/index.js). Public identifiers, not
# secrets: the team's signing keys are fetched from ACCESS_TEAM_DOMAIN and
# tokens must carry ACCESS_AUD (the reels-admin.boxedape.com Access app).
[vars]
ACCESS_TEAM_DOMAIN = "https://boxedape.cloudflareaccess.com"
ACCESS_AUD = "2e29c1b5799630e719957735e6af76b77df644ae10fa8aa9e550e9fc983f971c"

# Per-IP rate limiting (Cloudflare's Workers Rate Limiting binding - counted
# per location, in memory; nothing stored). IPs are only used as the
# counting key. period must be 10 or 60 (seconds).
# STATS_LIMITER: all stat beacons from one IP. VIEW_LIMITER: "view" beacons
# per IP per target - caps reload-spam at 2 opens/minute.
[[ratelimits]]
name = "STATS_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "VIEW_LIMITER"
namespace_id = "1002"
simple = { limit = 2, period = 60 }
