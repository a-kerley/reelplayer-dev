name = "reelplayer-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

kv_namespaces = [
  { binding = "REELS", id = "5114e49752a3447fb64d946f9ce7606b" }
]

r2_buckets = [
  { binding = "MEDIA", bucket_name = "reelplayer-media" }
]

# Per-IP rate limiting (Cloudflare's Workers Rate Limiting binding - counted
# per location, in memory; nothing stored). IPs are only used as the
# counting key. period must be 10 or 60 (seconds).
# STATS_LIMITER: all stat beacons from one IP. VIEW_LIMITER: "view" beacons
# per IP per target - caps reload-spam at 2 opens/minute. AUTH_LIMITER:
# failed password attempts on password-gated routes.
[[ratelimits]]
name = "STATS_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "VIEW_LIMITER"
namespace_id = "1002"
simple = { limit = 2, period = 60 }

[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }
