<!DOCTYPE html>
<html lang="en" class="page-html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page</title>

  <!-- Warm the connection to R2 (media host) as early as possible, matching
       player.html's own preconnect - keep in sync with js/config.js's
       R2_PUBLIC_URL if it ever changes. -->
  <link rel="preconnect" href="https://media.boxedape.com" crossorigin>

  <link rel="stylesheet" href="css/page.css">
</head>
<body class="page-body">
  <div id="pageRoot">
    <p class="page-status-message">Loading…</p>
  </div>

  <script type="module">
    // page.html - public, standalone renderer for a published page (an
    // ordered list of content blocks: banner image, text, player, image,
    // embedded video).
    // Structurally mirrors player.html's own bootstrap (URLSearchParams ->
    // fetch from the Worker -> render -> error state), and reuses
    // js/modules/pageBlockRenderer.js's renderBlock() - the SAME render
    // function the builder's own block-editor live preview uses - so this
    // file never becomes a second, hand-kept-in-sync copy of block-
    // rendering logic (see CLAUDE.md's player.html/player.js postmortem for
    // exactly the bug class this is designed to avoid repeating).
    import { WORKER_BASE_URL } from './js/config.js';
    import { renderBlock } from './js/modules/pageBlockRenderer.js';
    import { createSessionId, sendStatBeacon } from './js/modules/statsBeacon.js';
    import { applyPageBackground } from './js/modules/pageBackground.js';
    import { applyTextStyles } from './js/modules/pageTextStyles.js';
    import { applyBlockReveal } from './js/modules/pageBlockReveal.js';

    // No-op, exists solely for the side effect of registering a touch
    // handler on the document: iOS Safari otherwise ignores :active
    // entirely (a long-standing WebKit quirk - it only evaluates :active
    // for a tap when it detects a touch listener present somewhere on the
    // page), which would silently drop the button block's tap feedback
    // (css/page.css's .page-block-button-link:active) on iOS specifically,
    // the one platform this was added for.
    document.addEventListener('touchstart', () => {}, { passive: true });

    const root = document.getElementById('pageRoot');

    function showStatus(message) {
      root.innerHTML = `<p class="page-status-message">${message}</p>`;
    }

    async function loadPageData(slug) {
      try {
        const response = await fetch(`${WORKER_BASE_URL}/pages/${slug}`);
        if (!response.ok) return null;
        return await response.json();
      } catch (e) {
        console.error('Failed to fetch page from Worker:', e);
        return null;
      }
    }

    // Draft preview mode ("Preview Page" in the builder) - reads the
    // in-progress, possibly-unpublished/unsaved page straight out of
    // localStorage rather than fetching a published slug from the Worker,
    // so it always reflects exactly what's in the editor right now, not
    // whatever was last published. Same-origin only (localStorage doesn't
    // cross origins), which holds here since page.html and the builder are
    // served from the same static host. js/pagesController.js's
    // handlePreview() is the sole writer of this key.
    const PREVIEW_STORAGE_KEY = 'reelplayer:pagePreview';

    function loadPreviewPageData() {
      try {
        const raw = localStorage.getItem(PREVIEW_STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        console.error('Failed to read page preview data:', e);
        return null;
      }
    }

    function addPreviewWatermark() {
      const bar = document.createElement('div');
      bar.className = 'page-preview-watermark';
      bar.textContent = 'PREVIEW — this is not the published page';
      document.body.prepend(bar);
      document.body.classList.add('page-preview-mode');
    }

    function renderPage(pageData) {
      document.title = pageData.title || 'Page';

      const list = document.createElement('div');
      list.className = 'page-blocks-list';

      const blocks = Array.isArray(pageData.blocks) ? pageData.blocks : [];
      if (!blocks.length) {
        showStatus('This page has no content yet.');
        return;
      }

      blocks.forEach((block) => {
        list.appendChild(renderBlock(block, pageData));
      });

      root.innerHTML = '';
      root.appendChild(list);
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const isPreview = params.get('preview') === '1';
      const slug = params.get('slug');

      let pageData;
      if (isPreview) {
        pageData = loadPreviewPageData();
        if (!pageData) {
          showStatus('No preview data found - open this from the "Preview Page" button in the builder.');
          return;
        }
      } else {
        if (!slug) {
          showStatus('No page specified.');
          return;
        }
        pageData = await loadPageData(slug);
        if (!pageData) {
          showStatus('Page not found.');
          return;
        }
      }

      // Opt-in analytics - a page never plays anything itself (a player
      // block's iframe is just player.html, tracked independently under
      // that reel's own analyticsEnabled - see js/modules/statsBeacon.js),
      // so this is the entire page-side integration: one "view" beacon.
      // Skipped entirely in preview mode - it's not a real visit.
      if (!isPreview && pageData.analyticsEnabled === true) {
        sendStatBeacon('page', slug, { event: 'view', sessionId: createSessionId() });
      }

      // renderPage() first, THEN applyPageBackground() - the content-
      // overlay layer inside applyPageBackground() measures the actual
      // rendered .page-blocks-list/.page-status-message element, so it
      // needs to already be in the DOM. (js/pagesController.js's
      // renderPagePreview() already mounts content before calling this,
      // so only this file needed reordering.)
      renderPage(pageData);

      // Added before applyPageBackground() runs, not after - it measures
      // contentEl.offsetTop, which the watermark bar's body padding-top
      // shifts. Adding the padding first keeps that measurement accurate.
      if (isPreview) addPreviewWatermark();

      // scrollSource is `window` here (the real, standalone page) - see
      // js/modules/pageBackground.js's header comment for why the builder's
      // own live preview passes its own scrollable pane instead, and why
      // both call the exact same function rather than two implementations.
      applyPageBackground(document.body, pageData, window);
      applyTextStyles(document.body, pageData);
      applyBlockReveal(document.body, window);
    }

    init();
  </script>
</body>
</html>
